# ============================================================
# Adeptio v2.4.5 Merged — CI + deploy
# 1) smoke gate (renders every screen in node — must pass)
# 2) deploy the Cloudflare Worker (D1/KV/R2 API)
# The static client (index.html + js/ + css/) is served by Cloudflare Pages
# via the Git integration (root output, no build) OR GitHub Pages — see DEPLOY.md.
# Required repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# ============================================================
name: Adeptio v2.4.5 — CI + deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  smoke:
    name: Smoke — render every screen (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Smoke — render every screen (node)
        run: node tools/smoke.js .

  deploy-worker:
    name: Deploy Cloudflare Worker
    needs: smoke
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker
        # REAL gate: only runs when BOTH secrets exist, so the job stays GREEN
        # before Cloudflare is configured (env can read secrets; step-if can read env).
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
        # D1 schema is already applied (migrations/0001_init.sql, run out-of-band).
        # To (re)apply via CI instead, add to the step above:
        #   preCommands: wrangler d1 migrations apply adeptio-hr-v245 --remote
      - name: Assert Worker health (stores=15)
        # Same gate as Deploy: only asserts when Cloudflare is actually configured.
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        run: curl -s https://adeptio-hr-v245.pathom-bot.workers.dev/api/health | grep -q '"stores":15'
